name: credit_keeper
description: A Flutter app for managing customer accounts and tracking payments
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  supabase_flutter: ^2.0.0
  sizer: ^2.0.15
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  flutter_svg: ^2.0.9
  image_picker: ^1.0.4
  path_provider: ^2.1.1
  pdf: ^3.10.7
  printing: ^5.11.1
  url_launcher: ^6.2.1
  local_auth: ^2.1.6
  crypto: ^3.0.3
  http: ^1.1.0
  flutter_local_notifications: ^17.2.3
  permission_handler: ^11.0.1
  provider: ^6.1.5
  app_links: ^3.4.3
  photo_view: ^0.14.0
  flutter_contacts: ^1.1.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#3B82F6"
    theme_color: "#3B82F6"
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/

